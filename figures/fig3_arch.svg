<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Times New Roman','Georgia',serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5d23"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c8a84e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="900" height="500" fill="none"/>

  <!-- ═══ LAYER 1: SENSORES ═══ -->
  <rect x="30" y="20" width="250" height="150" rx="4" fill="#f0f5e8" stroke="#6b8e23" stroke-width="1.5"/>
  <rect x="30" y="20" width="250" height="30" rx="4" fill="#4a5d23"/>
  <text x="155" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">SENSORES (I²C @ 50 kHz)</text>

  <rect x="50" y="65" width="100" height="40" rx="3" fill="#fff" stroke="#6b8e23" stroke-width="1"/>
  <text x="100" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="700">AHT20</text>
  <text x="100" y="98" text-anchor="middle" fill="#555" font-size="9">T (±0.3°C) · RH (±2%)</text>

  <rect x="160" y="65" width="100" height="40" rx="3" fill="#fff" stroke="#6b8e23" stroke-width="1"/>
  <text x="210" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="700">BMP280</text>
  <text x="210" y="98" text-anchor="middle" fill="#555" font-size="9">P (±1 hPa)</text>

  <text x="100" y="130" text-anchor="middle" fill="#666" font-size="9">dir. 0x38</text>
  <text x="210" y="130" text-anchor="middle" fill="#666" font-size="9">dir. 0x76</text>

  <!-- ═══ LAYER 2: MCU ═══ -->
  <rect x="325" y="20" width="250" height="150" rx="4" fill="#f0f5e8" stroke="#6b8e23" stroke-width="1.5"/>
  <rect x="325" y="20" width="250" height="30" rx="4" fill="#4a5d23"/>
  <text x="450" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">MCU EMBEBIDO</text>

  <rect x="345" y="65" width="210" height="70" rx="3" fill="#fff" stroke="#c8a84e" stroke-width="1"/>
  <text x="450" y="82" text-anchor="middle" fill="#333" font-size="12" font-weight="700">XIAO ESP32-S3</text>
  <text x="450" y="97" text-anchor="middle" fill="#555" font-size="10">LX7 dual 240 MHz · 512 KB SRAM + 8 MB PSRAM</text>
  <text x="450" y="115" text-anchor="middle" fill="#555" font-size="10">Firmware C bare-metal · ESP-IDF v6.1</text>

  <text x="450" y="148" text-anchor="middle" fill="#666" font-size="9">Sincronizado @ 5 s · TinyML en MCU</text>

  <!-- ═══ LAYER 3: SALIDA ═══ -->
  <rect x="620" y="20" width="250" height="150" rx="4" fill="#f0f5e8" stroke="#6b8e23" stroke-width="1.5"/>
  <rect x="620" y="20" width="250" height="30" rx="4" fill="#4a5d23"/>
  <text x="745" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">BRIDGE PYTHON</text>

  <rect x="640" y="65" width="210" height="40" rx="3" fill="#fff" stroke="#6b8e23" stroke-width="1"/>
  <text x="745" y="82" text-anchor="middle" fill="#333" font-size="11" font-weight="700">Serial USB-CSV → HTTP JSON</text>
  <text x="745" y="96" text-anchor="middle" fill="#555" font-size="9">115200 baud · 8 columnas</text>

  <rect x="640" y="115" width="210" height="40" rx="3" fill="#fff" stroke="#c8a84e" stroke-width="1"/>
  <text x="745" y="132" text-anchor="middle" fill="#333" font-size="11" font-weight="700">API REST @ :8765</text>
  <text x="745" y="146" text-anchor="middle" fill="#555" font-size="9">JSON endpoint</text>

  <!-- ═══ FLECHAS L1→L2 ═══ -->
  <line x1="280" y1="75" x2="325" y2="75" stroke="#4a5d23" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="115" x2="325" y2="115" stroke="#4a5d23" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="63" text-anchor="middle" fill="#4a5d23" font-size="9" font-weight="700">SCL</text>
  <text x="302" y="103" text-anchor="middle" fill="#4a5d23" font-size="9" font-weight="700">SDA</text>

  <!-- ═══ FLECHA L2→L3 ═══ -->
  <path d="M 575 95 L 620 95" stroke="#4a5d23" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="597" y="82" text-anchor="middle" fill="#4a5d23" font-size="9" font-weight="700">USB</text>
  <text x="597" y="108" text-anchor="middle" fill="#666" font-size="8">CSV @ 5s</text>

  <!-- ═══ LAYER 4: CONSUMIDORES ═══ -->
  <rect x="30" y="250" width="840" height="30" rx="4" fill="#4a5d23"/>
  <text x="450" y="270" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">CONSUMIDORES</text>

  <rect x="50" y="300" width="240" height="130" rx="4" fill="#f5f0e8" stroke="#c8a84e" stroke-width="1.5"/>
  <text x="170" y="325" text-anchor="middle" fill="#4a5d23" font-size="14" font-weight="700">Dashboard Web</text>
  <text x="170" y="345" text-anchor="middle" fill="#555" font-size="10">Visualización en tiempo real</text>
  <text x="170" y="365" text-anchor="middle" fill="#555" font-size="10">T, RH, P, CO₂</text>
  <text x="170" y="385" text-anchor="middle" fill="#555" font-size="10">Serie temporal @ 5 s</text>

  <rect x="330" y="300" width="520" height="130" rx="4" fill="#f5f0e8" stroke="#c8a84e" stroke-width="1.5"/>
  <text x="590" y="325" text-anchor="middle" fill="#4a5d23" font-size="14" font-weight="700">Simulación RK4</text>
  <text x="590" y="345" text-anchor="middle" fill="#555" font-size="10">4 EDOs acopladas · T, W, C, Et</text>
  <text x="590" y="365" text-anchor="middle" fill="#555" font-size="10">Paso 1 min · 7 días · Monte Carlo N=100</text>
  <text x="590" y="385" text-anchor="middle" fill="#555" font-size="10">data_reader.py · comparison.py · RMSE/MAE</text>

  <!-- ═══ FLECHAS L3→L4 ═══ -->
  <path d="M 745 170 L 745 250" stroke="#c8a84e" stroke-width="2" fill="none" marker-end="url(#arrow-gold)" stroke-dasharray="4,2"/>
  <text x="760" y="215" fill="#c8a84e" font-size="9" font-weight="700">HTTP JSON</text>

  <!-- ═══ GASES (lado izquierdo, exento) ═══ -->
  <rect x="40" y="470" width="380" height="25" rx="3" fill="#e8f0e0" stroke="#6b8e23" stroke-width="1"/>
  <text x="230" y="487" text-anchor="middle" fill="#4a5d23" font-size="11">Variables modelo: Tín · HR · CO₂ · ET₀ · Radiación · Text</text>

  <rect x="480" y="470" width="380" height="25" rx="3" fill="#e8f0e0" stroke="#c8a84e" stroke-width="1"/>
  <text x="670" y="487" text-anchor="middle" fill="#4a5d23" font-size="11">Control predictivo: RL-Guided MPC · TinyML embebido</text>
</svg>
